name: Desktop build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  desktop:
    name: macOS arm64
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Cache Rust dependencies and sidecar builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/desktop-sidecar/target
          key: ${{ runner.os }}-rust-${{ hashFiles('crates/desktop-sidecar/Cargo.lock', 'crates/desktop-sidecar/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock', 'apps/desktop/package.json') }}

      - name: Import macOS signing identity
        env:
          MAC_CERTIFICATE_DER_BASE64: ${{ secrets.EDGEEVER_MAC_CERTIFICATE_DER_BASE64 }}
          MAC_PRIVATE_KEY_BASE64: ${{ secrets.EDGEEVER_MAC_PRIVATE_KEY_BASE64 }}
        run: |
          if [[ -z "$MAC_CERTIFICATE_DER_BASE64" || -z "$MAC_PRIVATE_KEY_BASE64" ]]; then
            echo "::error::EDGEEVER_MAC_CERTIFICATE_DER_BASE64 and EDGEEVER_MAC_PRIVATE_KEY_BASE64 are required"
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/edgeever-build.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_path="$RUNNER_TEMP/edgeever-mac-signing.cer"
          private_key_path="$RUNNER_TEMP/edgeever-mac-signing.pem"
          traditional_key_path="$RUNNER_TEMP/edgeever-mac-signing-rsa.pem"

          printf '%s' "$MAC_CERTIFICATE_DER_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$MAC_PRIVATE_KEY_BASE64" | base64 -D > "$private_key_path"
          openssl rsa -in "$private_key_path" -out "$traditional_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -f x509 \
            -t cert \
            -T /usr/bin/codesign
          security import "$traditional_key_path" \
            -k "$keychain_path" \
            -f openssl \
            -t priv \
            -P '' \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain_path"

          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Web renderer
        env:
          EDGE_EVER_DESKTOP_BUILD: "1"
        run: bun run build:web

      - name: Verify Web precache budget
        run: bun run verify:web-performance

      - name: Run project type checks
        run: |
          bun run typecheck
          bun run typecheck:mobile

      - name: Build debug sidecar for integration tests
        run: cargo build --manifest-path crates/desktop-sidecar/Cargo.toml

      - name: Run desktop regression tests
        run: bun run test:desktop

      - name: Build Rust sidecar
        run: |
          cargo fmt --manifest-path crates/desktop-sidecar/Cargo.toml -- --check
          cargo clippy --manifest-path crates/desktop-sidecar/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/desktop-sidecar/Cargo.toml
          cargo build --manifest-path crates/desktop-sidecar/Cargo.toml --release

      - name: Prepare Apple notarization API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.EDGEEVER_APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.EDGEEVER_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.EDGEEVER_APPLE_API_ISSUER }}
        run: |
          if [[ -z "$APPLE_API_KEY_BASE64" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            echo "::error::Apple notarization API key secrets are required"
            exit 1
          fi

          apple_api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$apple_api_key_path"
          chmod 600 "$apple_api_key_path"
          echo "APPLE_API_KEY=$apple_api_key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      - name: Package desktop installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/run-desktop-builder.mjs --publish ${{ github.event_name == 'release' && 'always' || 'never' }}

      - name: Verify desktop installer
        env:
          EDGE_EVER_VERIFY_TARGET: darwin
        run: bun scripts/verify-desktop-package.mjs

      - name: Upload desktop installer and metadata
        uses: actions/upload-artifact@v6
        with:
          name: edgeever-desktop-macOS-arm64
          path: |
            release/desktop/**/*.dmg
            release/desktop/**/*.zip
            release/desktop/**/*.blockmap
            release/desktop/**/*.yml
          if-no-files-found: error
          retention-days: 14
