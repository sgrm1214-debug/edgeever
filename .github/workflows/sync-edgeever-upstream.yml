name: Update deployed EdgeEver

# Keeps a deployment Fork aligned with upstream EdgeEver.
# Deployment Forks are read-only mirrors by default: when content differs,
# main resets to the selected Release (or edge main) and triggers Cloudflare.
# The rare customized Fork must explicitly opt in to merge preservation.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel for this run (stable = latest formal Release, edge = upstream main)
        required: true
        default: stable
        type: choice
        options:
          - stable
          - edge
      force_redeploy:
        description: When already on the target version, push an empty commit so Cloudflare Builds runs again
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: edgeever-upstream-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository != 'tianma-if/edgeever'
    name: Align and publish upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_REPOSITORY: tianma-if/edgeever
      UPDATE_CHANNEL: ${{ inputs.channel || vars.EDGE_EVER_UPDATE_CHANNEL || 'stable' }}
      FORCE_REDEPLOY: ${{ inputs.force_redeploy || false }}
      PRESERVE_FORK_CHANGES: ${{ vars.EDGE_EVER_PRESERVE_FORK_CHANGES || 'false' }}

    steps:
      - name: Checkout deployed repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Require a GitHub Fork
        shell: bash
        run: |
          set -euo pipefail
          is_fork="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.fork')"
          if [ "${is_fork}" != "true" ]; then
            echo "This deployment repository must be a GitHub Fork of ${UPSTREAM_REPOSITORY}." >&2
            echo "Create the repository with the EdgeEver Fork flow before enabling upstream updates." >&2
            exit 1
          fi

      - name: Resolve upstream version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main --tags

          case "${UPDATE_CHANNEL}" in
            stable)
              target_ref="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq '.tag_name')"
              ;;
            edge)
              target_ref="upstream/main"
              ;;
            *)
              echo "Unsupported update channel: ${UPDATE_CHANNEL}" >&2
              exit 1
              ;;
          esac

          target_commit="$(git rev-parse "${target_ref}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          target_version="$(git show "${target_commit}:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)"
          if [ -z "${target_version}" ]; then
            target_version="unknown"
          fi
          head_version="$(python3 -c 'import json; print(json.load(open("package.json")).get("version",""))' 2>/dev/null || true)"
          if [ -z "${head_version}" ]; then
            head_version="unknown"
          fi

          # Updater-only differences do not trigger a product update.
          content_diff="$(git diff --name-only "${target_commit}" HEAD -- ':!.github/workflows/sync-edgeever-upstream.yml' ':!scripts/upstream-sync-plan.mjs' || true)"
          content_matches_target=false
          if [ -z "${content_diff}" ]; then
            content_matches_target=true
          fi

          fork_mode=mirror
          if [ "${PRESERVE_FORK_CHANGES}" = "true" ]; then
            fork_mode=customized
          fi

          head_equals_target=false
          if [ "${head_commit}" = "${target_commit}" ]; then
            head_equals_target=true
          fi
          head_is_ancestor_of_target=false
          if git merge-base --is-ancestor HEAD "${target_commit}" 2>/dev/null; then
            head_is_ancestor_of_target=true
          fi
          target_is_ancestor_of_head=false
          if git merge-base --is-ancestor "${target_commit}" HEAD 2>/dev/null; then
            target_is_ancestor_of_head=true
          fi

          IFS=$'\t' read -r update_required align_mode reason republish_only < <(
            EDGE_SYNC_CONTENT_MATCHES_TARGET="${content_matches_target}" \
            EDGE_SYNC_FORCE_REDEPLOY="${FORCE_REDEPLOY}" \
            EDGE_SYNC_HEAD_EQUALS_TARGET="${head_equals_target}" \
            EDGE_SYNC_HEAD_IS_ANCESTOR_OF_TARGET="${head_is_ancestor_of_target}" \
            EDGE_SYNC_PRESERVE_FORK_CHANGES="${PRESERVE_FORK_CHANGES}" \
            EDGE_SYNC_TARGET_IS_ANCESTOR_OF_HEAD="${target_is_ancestor_of_head}" \
              node scripts/upstream-sync-plan.mjs
          )

          {
            echo "target_ref=${target_ref}"
            echo "target_commit=${target_commit}"
            echo "target_version=${target_version}"
            echo "head_commit=${head_commit}"
            echo "head_version=${head_version}"
            echo "update_required=${update_required}"
            echo "align_mode=${align_mode}"
            echo "reason=${reason}"
            echo "republish_only=${republish_only}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### EdgeEver upstream sync"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Channel | \`${UPDATE_CHANNEL}\` |"
            echo "| Fork mode | \`${fork_mode}\` |"
            echo "| Upstream target | \`${target_ref}\` (\`${target_commit:0:12}\`, v${target_version}) |"
            echo "| Fork main before | \`${head_commit:0:12}\` (v${head_version}) |"
            echo "| Decision | \`${reason}\` / align=\`${align_mode}\` / update=\`${update_required}\` / republish=\`${republish_only}\` |"
            echo ""
            case "${reason}" in
              already_on_target)
                echo "**Already on upstream target.** No git update is needed. This is success for a read-only deployment fork — not a skipped failure."
                ;;
              content_matches_target)
                echo "**Application content already matches upstream target** (history tip may differ). No git update is needed for deployment."
                ;;
              behind_target)
                echo "**Fork is behind upstream.** Aligning with a hard reset to the target commit (deploy-mirror path)."
                ;;
              deploy_mirror_reset)
                echo "**Deployment mirror differs from upstream.** Resetting onto the selected target; no Fork code is preserved in the default mode."
                ;;
              deploy_mirror_ahead)
                echo "**Deploy-only fork is ahead of the selected upstream target.** Resetting onto that target."
                ;;
              customized_contains_target)
                echo "**Opt-in customized fork already contains the upstream target.** Preserving its application changes without another merge."
                ;;
              customized_merge)
                echo "**Opt-in customized fork.** Merging upstream target and leaving production unchanged if verification fails."
                ;;
              *)
                echo "Decision reason: \`${reason}\`."
                ;;
            esac
            if [ "${republish_only}" = "true" ]; then
              echo ""
              echo "\`force_redeploy\` is set: will push an empty commit so Cloudflare Workers Builds runs again."
            fi
            echo ""
            echo "Prefer this workflow over GitHub **Sync fork**. The default mirror mode intentionally owns \`main\` and resets it to the selected upstream target."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "channel=${UPDATE_CHANNEL} target=${target_ref}@${target_commit:0:12} (v${target_version}) head=${head_commit:0:12} (v${head_version}) reason=${reason} align=${align_mode} update=${update_required} republish=${republish_only}"

      - name: Align to upstream
        if: steps.upstream.outputs.update_required == 'true'
        env:
          TARGET_COMMIT: ${{ steps.upstream.outputs.target_commit }}
          TARGET_REF: ${{ steps.upstream.outputs.target_ref }}
          ALIGN_MODE: ${{ steps.upstream.outputs.align_mode }}
          REASON: ${{ steps.upstream.outputs.reason }}
        run: |
          set -euo pipefail
          git config user.name "edgeever-updater[bot]"
          git config user.email "edgeever-updater[bot]@users.noreply.github.com"

          case "${ALIGN_MODE}" in
            reset)
              git reset --hard "${TARGET_COMMIT}"
              git clean -fd
              echo "Reset main onto ${TARGET_REF} (${TARGET_COMMIT:0:12}) because ${REASON}."
              ;;
            merge)
              if ! git merge --no-edit -m "chore: update EdgeEver from ${TARGET_REF}" "${TARGET_COMMIT}"; then
                git merge --abort || true
                echo "Merge from ${TARGET_REF} conflicted with local application changes." >&2
                echo "Resolve the customized fork manually, or remove EDGE_EVER_PRESERVE_FORK_CHANGES to return to mirror mode." >&2
                exit 1
              fi
              echo "Merged ${TARGET_REF} (${TARGET_COMMIT:0:12}) because ${REASON}."
              ;;
            *)
              echo "Unsupported align mode: ${ALIGN_MODE}" >&2
              exit 1
              ;;
          esac

      - name: Set up Bun
        if: steps.upstream.outputs.align_mode == 'merge'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify customized merge
        if: steps.upstream.outputs.align_mode == 'merge'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run db:migrate:local
          bun test --path-ignore-patterns='tests/e2e/**'
          bun run typecheck
          bun run build

      - name: Publish update
        id: publish
        if: steps.upstream.outputs.update_required == 'true' || steps.upstream.outputs.republish_only == 'true'
        env:
          TARGET_REF: ${{ steps.upstream.outputs.target_ref }}
          UPDATE_REQUIRED: ${{ steps.upstream.outputs.update_required }}
          REPUBLISH_ONLY: ${{ steps.upstream.outputs.republish_only }}
          ALIGN_MODE: ${{ steps.upstream.outputs.align_mode }}
          REASON: ${{ steps.upstream.outputs.reason }}
        run: |
          set -euo pipefail
          git config user.name "edgeever-updater[bot]"
          git config user.email "edgeever-updater[bot]@users.noreply.github.com"

          if [ "${REPUBLISH_ONLY}" = "true" ] && [ "${UPDATE_REQUIRED}" != "true" ]; then
            git commit --allow-empty -m "chore: retrigger EdgeEver deployment for ${TARGET_REF}"
            git push origin HEAD:main
            echo "mode=empty_commit" >> "${GITHUB_OUTPUT}"
            echo "Pushed empty commit to retrigger Cloudflare Workers Builds."
            exit 0
          fi

          if [ "${ALIGN_MODE}" = "reset" ]; then
            if [ "${REASON}" = "behind_target" ]; then
              git push origin HEAD:main
              echo "mode=fast_forward" >> "${GITHUB_OUTPUT}"
              echo "Published fast-forward main for ${TARGET_REF}."
            else
              # Diverged mirrors require a guarded history rewrite.
              git push --force-with-lease origin HEAD:main
              echo "mode=force_with_lease" >> "${GITHUB_OUTPUT}"
              echo "Published reset main for ${TARGET_REF}."
            fi
          else
            git push origin HEAD:main
            echo "mode=push" >> "${GITHUB_OUTPUT}"
            echo "Published merge for ${TARGET_REF}."
          fi

      - name: Trigger Cloudflare Deploy Hook
        if: steps.publish.outcome == 'success'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.EDGE_EVER_CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            echo "No EDGE_EVER_CLOUDFLARE_DEPLOY_HOOK_URL secret — relying on Cloudflare Git integration for main pushes."
            echo "Optional: add a Workers/Pages Deploy Hook secret if pushes do not start builds." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          curl -fsS -X POST "${DEPLOY_HOOK_URL}" >/dev/null
          echo "Triggered Cloudflare Deploy Hook."
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Triggered optional Cloudflare Deploy Hook after publish." >> "${GITHUB_STEP_SUMMARY}"

      - name: Final status
        if: always() && steps.upstream.outcome == 'success'
        env:
          TARGET_REF: ${{ steps.upstream.outputs.target_ref }}
          TARGET_COMMIT: ${{ steps.upstream.outputs.target_commit }}
          TARGET_VERSION: ${{ steps.upstream.outputs.target_version }}
          UPDATE_REQUIRED: ${{ steps.upstream.outputs.update_required }}
          REPUBLISH_ONLY: ${{ steps.upstream.outputs.republish_only }}
          REASON: ${{ steps.upstream.outputs.reason }}
          ALIGN_MODE: ${{ steps.upstream.outputs.align_mode }}
        run: |
          set -euo pipefail
          final_commit="$(git rev-parse HEAD)"
          {
            echo ""
            echo "### Result"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Final main | \`${final_commit:0:12}\` |"
            echo "| Target | \`${TARGET_REF}\` / v${TARGET_VERSION} |"
            if [ "${UPDATE_REQUIRED}" = "true" ]; then
              echo "| Outcome | Updated and published (\`${ALIGN_MODE}\`) |"
              echo ""
              echo "Cloudflare Workers Builds should deploy this commit from \`main\`. Confirm the Deployment commit SHA matches \`${final_commit:0:12}\`."
            elif [ "${REPUBLISH_ONLY}" = "true" ]; then
              echo "| Outcome | Republished empty commit for redeploy |"
            else
              echo "| Outcome | Already aligned (\`${REASON}\`) — no push |"
              echo ""
              echo "If the live site still shows an older version while Git is current, open Cloudflare **Deployments** and retry the latest build, or re-run this workflow with **force_redeploy**."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "final=${final_commit:0:12} reason=${REASON} update=${UPDATE_REQUIRED} republish=${REPUBLISH_ONLY}"

      - name: Report an update failure
        if: failure()
        continue-on-error: true
        env:
          TARGET_REF: ${{ steps.upstream.outputs.target_ref || 'unknown' }}
        run: |
          set -euo pipefail
          title="EdgeEver automatic update requires attention"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -z "${existing}" ]; then
            gh issue create \
              --title "${title}" \
              --body "The daily update from \`${UPSTREAM_REPOSITORY}\` (${TARGET_REF}) could not be aligned or verified. The current production deployment was left unchanged. Open the failed **Update deployed EdgeEver** workflow run for details (see the job summary for channel/target/reason), then retry it manually after resolving the problem."
          fi
