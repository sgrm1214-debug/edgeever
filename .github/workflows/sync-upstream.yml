name: Sync upstream
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OOKK }}
      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
      - name: Add upstream remote
        run: git remote add upstream https://github.com/tianma-if/edgeever.git
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream/main into main
        run: |
          git checkout main
          git merge upstream/main --no-edit || {
            echo "自动合并失败，存在冲突，请手动处理";
            exit 1;
          }
      - name: Push changes
        run: git push https://x-access-token:${{ secrets.OOKK }}@github.com/sgrm1214-debug/edgeever.git main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run D1 remote migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b0dc8433c33e625f83beae3ef49aa71
        run: npx wrangler d1 migrations apply edgeever --remote
