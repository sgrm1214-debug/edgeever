name: Sync upstream
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OOKK }}
      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
      - name: Add upstream remote
        run: git remote add upstream https://github.com/tianma-if/edgeever.git
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream/main into main (auto-resolve favoring upstream)
        run: |
          git checkout main
          if git merge upstream/main --no-edit -X theirs; then
            echo "自动合并成功，无冲突。"
          else
            echo "存在冲突，自动采用上游版本解决...";
            for f in $(git diff --name-only --diff-filter=U); do
              if git cat-file -e upstream/main:"$f" 2>/dev/null; then
                git checkout --theirs "$f";
                git add "$f";
              else
                git rm -f "$f" 2>/dev/null || rm -f "$f";
                git add -A -- "$f" 2>/dev/null || true;
              fi
            done
            git add -A
            git commit --no-edit
            echo "冲突已自动解决，全部采用上游版本。"
          fi
      - name: Force-fix D1 database_id
        run: |
          sed -i 's/database_id = "00000000-0000-0000-0000-000000000000"/database_id = "971bdff7-8066-4ea7-9dc7-0cba1f1ce396"/' wrangler.toml
          if git diff --quiet wrangler.toml; then
            echo "No fix needed, database_id already correct."
          else
            git add wrangler.toml
            git commit -m "fix: restore correct D1 database_id after merge"
            echo "database_id corrected."
          fi
      - name: Push changes
        run: git push https://x-access-token:${{ secrets.OOKK }}@github.com/sgrm1214-debug/edgeever.git main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run D1 remote migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b0dc8433c33e625f83beae3ef49aa71
        run: npx wrangler d1 migrations apply edgeever --remote
